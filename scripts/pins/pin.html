<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@500;700&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1000px;height:1500px;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP",sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(70% 50% at 50% 70%,color-mix(in srgb,var(--acc) 18%,transparent),transparent 70%)}
.top{position:absolute;left:80px;right:80px;top:96px}
h1{font:700 92px/1.06 Fraunces,serif;letter-spacing:-.01em;white-space:pre-line}
.ja h1{font:700 66px/1.3 "Shippori Mincho",serif;letter-spacing:0;word-break:keep-all;overflow-wrap:normal}
.sub{margin-top:30px;font-weight:600;font-size:34px;color:var(--acc)}
.pills{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.pills span{border:3px solid var(--acc);color:var(--acc);border-radius:16px;padding:12px 22px;font-weight:600;font-size:26px}
.brand{position:absolute;left:80px;bottom:56px;font-weight:700;font-size:28px;color:color-mix(in srgb,var(--ink) 72%,transparent)}
.brand b{color:var(--acc)}
.cta{position:absolute;right:80px;bottom:44px;background:var(--acc);color:var(--bg);font-weight:700;font-size:28px;padding:18px 30px;border-radius:999px}
.laptop{position:absolute}
.screen{background:#111;border-radius:20px 20px 0 0;padding:14px 14px 20px;box-shadow:0 40px 80px -30px rgba(0,0,0,.45)}
.screen img{display:block;width:100%;border-radius:6px}
.base{height:24px;margin:0 -50px;background:linear-gradient(#cfd1d6,#9a9ca3);border-radius:0 0 20px 20px}
.phone{position:absolute;background:#111;border-radius:46px;padding:12px;box-shadow:0 40px 70px -25px rgba(0,0,0,.5)}
.phone img{display:block;width:100%;border-radius:34px}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:80px;height:22px;background:#111;border-radius:12px;z-index:2}
.tag{position:absolute;left:50%;transform:translateX(-50%);bottom:-62px;font-weight:700;font-size:30px;white-space:nowrap}
.tall{position:absolute;left:50%;transform:translateX(-50%);background:#111;border-radius:44px;padding:12px;box-shadow:0 40px 70px -25px rgba(0,0,0,.5);overflow:hidden}
.tall .clip{border-radius:32px;overflow:hidden;height:100%}
.tall img{display:block;width:100%}
.card{position:absolute;background:color-mix(in srgb,var(--ink) 6%,var(--bg));border:3px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:28px;padding:34px 30px;font-size:30px;line-height:1.5;color:color-mix(in srgb,var(--ink) 75%,transparent)}
.card b{display:block;font-size:34px;color:var(--ink);margin-bottom:14px}
.arrow{position:absolute;font:700 80px/1 Inter,sans-serif;color:var(--acc)}
.lbl{position:absolute;font-weight:700;font-size:30px}
</style></head><body>
<div class="glow"></div>
<div class="top" id="top"><h1 id="h"></h1><div class="sub" id="sub"></div><div class="pills" id="p"></div></div>
<div id="stage"></div>
<div class="brand"><b>●</b> Polyglot Pages</div>
<div class="cta" id="cta"></div>
<script>
const q=new URLSearchParams(location.search), d=JSON.parse(q.get('d')), v=q.get('v');
const r=document.documentElement.style; r.setProperty('--bg',d.bg); r.setProperty('--ink',d.ink); r.setProperty('--acc',d.acc);
const $=id=>document.getElementById(id), stage=$('stage');
const phone=(src,o,tag)=>{const e=document.createElement('div');e.className='phone';Object.assign(e.style,o);e.innerHTML=`<img src="${src}">`+(tag?`<div class="tag">${tag}</div>`:'');stage.appendChild(e);};
const laptop=(src,o)=>{const e=document.createElement('div');e.className='laptop';Object.assign(e.style,o);e.innerHTML=`<div class="screen"><img src="${src}"></div><div class="base"></div>`;stage.appendChild(e);};
const langs=d.es?'EN · 中文 · 日本語 · Español':'EN · 中文 · 日本語';
if(v==='a'){ // English feature pin
  $('h').textContent=d.title; $('sub').textContent=(d.es?'No monthly fees · ':'Pure HTML · No monthly fees · ')+langs;
  $('p').innerHTML=d.pills.map(x=>`<span>${x}</span>`).join('');
  laptop('en-desk.jpg',{left:'150px',top:'760px',width:'790px'}); phone('en-mob.jpg',{left:'70px',top:'840px',width:'250px'});
  $('cta').textContent='Get the template →';
} else if(v==='b'){ // languages pin
  $('h').textContent='One website.\n'+(d.es?'Five':'Four')+' languages.'; $('sub').textContent=d.cat+' template · switch in one tap';
  phone('en-mob.jpg',{left:'70px',top:'640px',width:'262px'},'English');
  phone('zh-mob.jpg',{left:'369px',top:'610px',width:'262px'},'中文');
  phone('ja-mob.jpg',{left:'668px',top:'640px',width:'262px'},'日本語');
  $('cta').textContent='See the demo →';
} else if(v==='d'){ // every section: top / middle / bottom of the page on three phones
  $('h').textContent='Every section,\nready to go'; $('sub').textContent=d.cat+' template · '+langs;
  const im=new Image(); im.src='en-full.jpg';
  im.onload=()=>{ const H=im.naturalHeight/im.naturalWidth; // page height in widths
    [[70,640,.0,'Top'],[369,610,.38,'Middle'],[668,640,.76,'Bottom']].forEach(([x,y,f,t])=>{
      const e=document.createElement('div');e.className='tall';Object.assign(e.style,{left:x+'px',top:y+'px',transform:'none',width:'262px',height:'540px'});
      const shift=Math.max(0,Math.min(f*H*238, H*238-516));
      e.innerHTML=`<div class="clip"><img src="en-full.jpg" style="transform:translateY(-${shift}px)"></div>`;stage.appendChild(e);});
    document.body.dataset.imgs='1'; };
  $('cta').textContent='Get the template →';
} else if(v==='e'){ // listing only vs real website
  $('h').textContent='From a map listing\nto a real website'; $('sub').textContent=d.cat+' · one-time price, no monthly fees';
  const c=document.createElement('div');c.className='card';Object.assign(c.style,{left:'70px',top:'720px',width:'360px'});
  c.innerHTML='<b>Without a website</b>Name, hours and a phone number.<br>No menu, no booking, no story.';stage.appendChild(c);
  const a=document.createElement('div');a.className='arrow';a.textContent='→';Object.assign(a.style,{left:'448px',top:'880px'});stage.appendChild(a);
  phone('en-mob.jpg',{left:'540px',top:'560px',width:'370px'});
  $('cta').textContent='Get the template →';
} else { // Japanese pin
  document.body.classList.add('ja');
  $('h').innerHTML=d.ja.replace(/・/g,'・<wbr>')+'向け<br>ホームページ<wbr>テンプレート'; $('sub').textContent='月額0円・買い切り・スマホ対応';
  $('p').innerHTML=['日本語版つき','LINE ボタン','日本語ガイド'].map(x=>`<span>${x}</span>`).join('');
  laptop('ja-desk.jpg',{left:'150px',top:'790px',width:'790px'}); phone('ja-mob.jpg',{left:'70px',top:'860px',width:'250px'});
  $('cta').textContent='テンプレートを見る →';
}
const h=$('h'); document.fonts.ready.then(()=>{let f=parseFloat(getComputedStyle(h).fontSize);while((h.scrollWidth>840||$('top').getBoundingClientRect().bottom>(v==='b'||v==='d'?440:(v==='e'?560:720)))&&f>40){f-=2;h.style.fontSize=f+'px';}if(v==='d'){const w=()=>document.body.dataset.imgs?document.body.dataset.ready='1':setTimeout(w,50);w();}else document.body.dataset.ready='1';});
</script></body></html>
