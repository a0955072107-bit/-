<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:var(--w);height:var(--h);background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(60% 70% at 78% 45%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%)}
.text{position:absolute}
h1{font:700 var(--tsize)/1.08 Fraunces,serif;letter-spacing:-.01em;white-space:pre;display:inline-block}
.sub{margin-top:28px;font-weight:600;font-size:var(--ssize);color:var(--acc)}
.pills{display:flex;flex-wrap:wrap;gap:16px;margin-top:40px}
.pills span{border:3px solid var(--acc);color:var(--acc);border-radius:16px;padding:14px 24px;font-weight:600;font-size:var(--psize)}
.laptop{position:absolute}
.screen{background:#111;outline:2px solid color-mix(in srgb,var(--ink) 14%,transparent);border-radius:22px 22px 0 0;padding:16px 16px 22px;box-shadow:0 40px 80px -30px rgba(0,0,0,.45)}
.screen img{display:block;width:100%;border-radius:6px}
.base{height:26px;margin:0 -60px;background:linear-gradient(#cfd1d6,#9a9ca3);border-radius:0 0 22px 22px;position:relative}
.base::after{content:"";position:absolute;left:50%;top:0;width:180px;height:10px;transform:translateX(-50%);background:#8b8d93;border-radius:0 0 10px 10px}
.phone{position:absolute;background:#111;outline:2px solid color-mix(in srgb,var(--ink) 14%,transparent);border-radius:46px;padding:12px;box-shadow:0 40px 70px -25px rgba(0,0,0,.5)}
.phone img{display:block;width:100%;border-radius:34px}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:84px;height:24px;background:#111;border-radius:14px;z-index:2}
</style></head><body>
<div class="glow"></div>
<div class="text" id="t"><h1 id="h"></h1><div class="sub" id="sub">Pure HTML · No monthly fees · English + 中文</div><div class="pills" id="p"></div></div>
<div class="laptop" id="l"><div class="screen"><img id="d"></div><div class="base"></div></div>
<div class="phone" id="m"><img id="mi"></div>
<script>
const q=new URLSearchParams(location.search), d=JSON.parse(q.get('d')), sq=q.get('sq')==='1';
const r=document.documentElement.style;
r.setProperty('--bg',d.bg);r.setProperty('--ink',d.ink);r.setProperty('--acc',d.acc);
document.getElementById('h').textContent=d.title;if(d.sub)document.getElementById('sub').textContent=d.sub;
document.getElementById('p').innerHTML=d.pills.map(x=>`<span>${x}</span>`).join('');
document.getElementById('d').src=`desk.jpg`;document.getElementById('mi').src=`mob.jpg`;
const S=(id,o)=>Object.assign(document.getElementById(id).style,o);
if(!sq){r.setProperty('--w','1920px');r.setProperty('--h','1080px');r.setProperty('--tsize','100px');r.setProperty('--ssize','30px');r.setProperty('--psize','24px');
 S('t',{left:'90px',top:'260px',width:'720px'});S('l',{left:'1030px',top:'190px',width:'830px'});S('m',{left:'880px',top:'440px',width:'240px'});}
else{r.setProperty('--w','1000px');r.setProperty('--h','1000px');r.setProperty('--tsize','76px');r.setProperty('--ssize','26px');r.setProperty('--psize','22px');
 S('t',{left:'70px',top:'64px',width:'860px'});S('l',{left:'250px',top:'470px',width:'680px'});S('m',{left:'90px',top:'540px',width:'210px'});
 document.querySelector('.pills').style.display='none';}
const h=document.getElementById('h'), maxW=parseFloat(document.getElementById('t').style.width);
document.fonts.ready.then(()=>{let f=parseFloat(getComputedStyle(h).fontSize);while(h.scrollWidth>maxW&&f>40){f-=2;h.style.fontSize=f+'px';}document.body.dataset.ready='1';});
</script></body></html>
