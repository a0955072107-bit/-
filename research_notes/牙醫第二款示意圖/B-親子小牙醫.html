<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito+Sans:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F9FF;--navy:#1B2A4A;--sun:#FFD45C;--coral:#FF8A6B;--mint:#CDEFE3;--muted:#46536E;--white:#FCFDFF}
*{box-sizing:border-box;margin:0;padding:0}
p{text-wrap:pretty}
body{background:var(--bg);color:var(--navy);font:400 17px/1.8 "Nunito Sans","Noto Sans TC",sans-serif;overflow-x:clip}
h1,h2{font-family:Fredoka,"Noto Sans TC",sans-serif;font-weight:700;line-height:1.25;text-wrap:balance}
header{display:flex;align-items:center;gap:2rem;padding:1.2rem clamp(1.25rem,4vw,3.5rem)}
.logo{display:flex;align-items:center;gap:.55rem;font:900 1.2rem/1 "Noto Sans TC";margin-right:auto}
.logo i{width:34px;height:34px;border-radius:12px;background:var(--sun);display:grid;place-items:center}
.logo i::after{content:"";width:14px;height:14px;background:var(--navy);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
nav{display:flex;gap:1.5rem;font-weight:500;font-size:.95rem}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.85rem 1.6rem;border-radius:999px;font-weight:700;text-decoration:none}
.btn-p{background:var(--navy);color:var(--white)}.btn-s{background:var(--sun);color:var(--navy)}.btn-g{border:2px solid var(--navy)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3rem;align-items:center;padding:2.5rem clamp(1.25rem,4vw,3.5rem) 4rem;max-width:1300px;margin:auto}
.hero h1{font-size:clamp(2.2rem,4vw,3.6rem);margin-bottom:1rem}
.hero p{color:var(--muted);font-size:1.08rem;margin-bottom:1.8rem;max-width:30rem}
.cta{display:flex;flex-wrap:wrap;gap:.7rem}
.facts{display:flex;gap:.6rem;margin-top:1.6rem;flex-wrap:wrap}
.facts span{background:var(--mint);padding:.3rem .9rem;border-radius:999px;font-size:.88rem;font-weight:500}
.art{position:relative;aspect-ratio:1/.92}
.blob{position:absolute;inset:4% 6% 2% 4%;border-radius:58% 42% 48% 52%/52% 46% 54% 48%;background:var(--sun)}
.photo{position:absolute;inset:12% 14% 10% 12%;border-radius:46% 54% 44% 56%/50% 44% 56% 50%;overflow:hidden;
 background:radial-gradient(circle at 38% 40%,#ffe9d8 0 12%,transparent 12.5%),radial-gradient(ellipse 22% 26% at 38% 70%,var(--coral) 0 98%,transparent),radial-gradient(circle at 64% 46%,#f6dcc6 0 9%,transparent 9.5%),radial-gradient(ellipse 16% 20% at 64% 74%,color-mix(in srgb,var(--navy) 70%,var(--mint)) 0 98%,transparent),linear-gradient(180deg,var(--mint),color-mix(in srgb,var(--mint) 60%,var(--white)))}
.brush{position:absolute;right:2%;top:14%;width:9%;height:44%;border-radius:20px;background:var(--coral);transform:rotate(22deg)}
.brush::before{content:"";position:absolute;top:-16%;left:-10%;right:-10%;height:22%;border-radius:8px;background:repeating-linear-gradient(90deg,var(--white) 0 4px,var(--mint) 4px 8px)}
.star{position:absolute;width:12%;aspect-ratio:1;background:var(--coral);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.s1{left:0;top:8%}.s2{left:8%;bottom:4%;width:8%;background:var(--navy)}.s3{right:12%;bottom:0;width:7%;background:var(--sun);outline:0}
.wave{height:60px;background:radial-gradient(40px 30px at 40px 60px,var(--white) 98%,transparent) 0 0/80px 60px repeat-x}
.svc{background:var(--white);padding:2.5rem clamp(1.25rem,4vw,3.5rem) 5rem}
.svc h2{text-align:center;font-size:2rem;margin-bottom:1.3rem}
.tabs{display:flex;justify-content:center;gap:.5rem;margin-bottom:2rem}
.tabs span{padding:.7rem 1.6rem;border-radius:999px;border:2px solid color-mix(in srgb,var(--navy) 18%,transparent);font-weight:700}
.tabs .on{background:var(--sun);border-color:var(--sun)}
.items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;max-width:1200px;margin:auto}
.it{background:var(--bg);border-radius:24px;padding:1.4rem}.it h3{font-size:1.08rem}.it p{color:var(--muted);font-size:.92rem;line-height:1.65}
.mbar{display:none}.burger{display:none;width:26px;height:16px;border-top:2px solid;border-bottom:2px solid;position:relative}.burger::after{content:"";position:absolute;left:0;right:0;top:5px;border-top:2px solid}
@media(max-width:760px){nav,header .btn{display:none}.burger{display:block}
 .hero{grid-template-columns:1fr;gap:1.2rem;padding-top:.5rem}.art{order:-1;max-width:330px;width:100%;margin:auto;aspect-ratio:1/.75}
 .items{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs span{padding:.6rem 1.1rem}
 .mbar{display:grid;grid-template-columns:1fr 1.4fr;gap:.6rem;position:fixed;inset:auto 0 0;padding:.7rem 1rem;background:var(--white);z-index:9;box-shadow:0 -1px 0 var(--mint)}}
</style></head><body>
<header><span class="logo"><i></i>晴晴親子牙醫</span><nav><span>孩子看牙</span><span>大人</span><span>長輩</span><span>門診時間</span><span>交通</span></nav><span>繁 ▾</span><a class="btn btn-s">LINE 預約</a><span class="burger"></span></header>
<section class="hero"><div><h1>第一次看牙，<br>從認識診間開始</h1><p>晴晴牙醫在新竹東區。先讓孩子摸摸器材、躺躺看椅子，準備好了再檢查。</p><div class="cta"><a class="btn btn-p">LINE 預約</a><a class="btn btn-g">撥打 03-123-4567</a></div><div class="facts"><span>兒童塗氟</span><span>窩溝封填</span><span>週六全天看診</span></div></div>
<div class="art"><div class="blob"></div><div class="photo"></div><div class="brush"></div><i class="star s1"></i><i class="star s2"></i><i class="star s3"></i></div></section>
<div class="wave"></div>
<section class="svc"><h2>誰要來看牙？</h2><div class="tabs"><span class="on">孩子</span><span>大人</span><span>長輩</span></div>
<div class="items"><div class="it"><h3>乳牙檢查</h3><p>長出第一顆牙就可以開始。</p></div><div class="it"><h3>兒童塗氟</h3><p>未滿 6 歲每半年一次。</p></div><div class="it"><h3>窩溝封填</h3><p>恆牙長出後保護咬合面。</p></div><div class="it"><h3>蛀牙治療</h3><p>先溝通、再分次進行。</p></div></div></section>
<div class="mbar"><a class="btn btn-g">撥打電話</a><a class="btn btn-s">LINE 預約</a></div>
</body></html>
