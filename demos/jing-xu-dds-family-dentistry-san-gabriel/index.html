<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- polyglot-demo lead=L0004 created=2026-11-23 -->
<title>Choose language · 選擇語言 · 言語を選択</title>
<!-- 語言入口：訪客打開網站根目錄時，依瀏覽器語言自動前往 en/、zh-TW/ 或 zh-CN/。
     Language entry: sends visitors to en/, zh-TW/ or zh-CN/ based on their browser language.
     想固定預設語言：把下面 script 刪掉，改成 <meta http-equiv="refresh" content="0; url=zh-TW/">。 -->
<link rel="alternate" hreflang="en" href="en/">
<link rel="alternate" hreflang="zh-Hant" href="zh-TW/">
<link rel="alternate" hreflang="zh-Hans" href="zh-CN/">
<link rel="alternate" hreflang="x-default" href="en/">
<script>
(function () {
  var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']).map(function (l) { return String(l).toLowerCase(); });
  var pick = 'en/';
  // Only languages this template ships with (listed in the links below) are chosen.
  function has(code) { return !!document.querySelector('a[hreflang="' + code + '"]'); }
  for (var i = 0; i < langs.length; i++) {
    var l = langs[i];
    if (/^zh-(cn|sg|my|hans)/.test(l)) { pick = 'zh-CN/'; break; }
    if (/^zh/.test(l)) { pick = 'zh-TW/'; break; }
    if (/^ja/.test(l) && has('ja')) { pick = 'ja/'; break; }
    if (/^es/.test(l) && has('es')) { pick = 'es/'; break; }
    if (/^en/.test(l)) { pick = 'en/'; break; }
  }
  location.replace(pick + location.hash);
})();
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-content:center;gap:16px;text-align:center;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;background:#f6f5f1;color:#1d1f22}
nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{padding:10px 18px;border:1px solid #cfcdc6;border-radius:10px;color:inherit;text-decoration:none}
a:hover,a:focus-visible{border-color:#1d1f22}
@media (prefers-color-scheme:dark){body{background:#15171a;color:#ecebe6}a{border-color:#3a3e44}a:hover,a:focus-visible{border-color:#ecebe6}}
</style>
</head>
<body>
<p>Choose your language · 選擇語言 · 选择语言</p>
<nav>
  <a href="en/" hreflang="en" lang="en">English</a>
  <a href="zh-TW/" hreflang="zh-Hant" lang="zh-Hant">繁體中文</a>
  <a href="zh-CN/" hreflang="zh-Hans" lang="zh-Hans">简体中文</a>
</nav>
</body>
</html>
